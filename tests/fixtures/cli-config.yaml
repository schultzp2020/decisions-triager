# CLI-test fixture: a valid config pointing at the shipped example
# catalogs, so subprocess tests run from any checkout without the
# gitignored deployment config.yaml.
jira:
  server: https://example.atlassian.net
jql:
  candidate: "project in (PROJ) AND status != closed"
  audit: "project in (PROJ) AND component is not EMPTY"
classifier:
  backend: llama
  base_url: http://localhost:8080/v1
  model: test-model
files:
  teams: teams.example.json
  components: components.example.json
